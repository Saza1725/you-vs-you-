<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   YOU VS YOU -- Live-Overlay fuer den Stream
   Farben aus dem Logo: Glut-Orange auf fast schwarzer Platte.
   ============================================================ */
:root{
  --glut:    #FF7A18;
  --glut-hi: #FFB25E;
  --weiss:   #FFFFFF;
  --dim:     rgba(255,255,255,.58);
  --alarm:   #FF3B30;
  --platte:  linear-gradient(180deg, rgba(18,12,9,.88) 0%, rgba(8,6,6,.93) 100%);
  --rand:    rgba(255,122,24,.50);
}
*{margin:0;padding:0;box-sizing:border-box}
html{ font-size: min(calc(100vw / 192), calc(100vh / 108)); }
body{
  background:transparent;                       /* PFLICHT fuer Overlay */
  font-family:'Rajdhani','Arial Narrow',Arial,sans-serif;
  color:var(--weiss); overflow:hidden; width:100vw; height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* Sichtfeld. Standard: ganze Breite (Twitch ist 16:9).
   Mit ?hoch=1 rutscht alles in den hochformat-sicheren Bereich. */
.feld{ position:absolute; inset:0 }
body.hoch .feld{ left:50%; transform:translateX(-50%); width:56.25vh; right:auto }

/* ---- LIVE oben links ---- */
.live{
  position:absolute; top:2.4rem; left:2.4rem;
  display:inline-flex; align-items:center; gap:.7rem;
  padding:.55rem 1.15rem .65rem;
  background:rgba(8,6,6,.88); border:.15rem solid var(--rand); border-radius:.5rem;
  box-shadow:0 .3rem 1.2rem rgba(0,0,0,.6);
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.2em; font-size:1.5rem;
}
.live.aus{ display:none }
.live i{
  width:.9rem; height:.9rem; border-radius:50%; background:var(--alarm);
  box-shadow:0 0 .9rem var(--alarm); display:block;
  animation:puls 2s ease-in-out infinite;
}
@keyframes puls{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* ---- Datenspalte links ---- */
.spalte{
  position:absolute; top:7.6rem; left:2.4rem; width:21rem;
  background:var(--platte); border:.16rem solid var(--rand); border-radius:.6rem;
  overflow:hidden; box-shadow:0 .5rem 2rem rgba(0,0,0,.6);
}
.spalte .titel{
  padding:.8rem 1.2rem .85rem; text-align:center;
  background:linear-gradient(180deg, rgba(255,122,24,.24), rgba(255,122,24,.06));
  border-bottom:.16rem solid var(--rand);
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.2em; font-size:1.35rem; color:var(--glut-hi);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.zeile{ padding:.8rem 1.2rem .85rem }
.zeile + .zeile{ border-top:.1rem solid rgba(255,122,24,.20) }
.zeile.gross .val{ font-size:3.9rem }
.zeile .lab{
  font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.13em; font-size:1.15rem; color:var(--glut);
}
.zeile .row{ display:flex; align-items:baseline; gap:.5rem; margin-top:.32rem }
.zeile .val{
  font-weight:700; font-size:2.75rem; line-height:1;
  font-variant-numeric:tabular-nums; white-space:nowrap;
  text-shadow:0 .12rem .5rem rgba(0,0,0,.85);
}
.zeile .unit{
  font-family:'Oswald',sans-serif; font-weight:600; font-size:1.1rem;
  color:var(--dim); letter-spacing:.08em;
}
.zeile.hidden{ display:none }

/* Endspurt: letzte 10 Minuten */
.zeile.final .val{ color:var(--alarm) }
.zeile.final .lab{ color:var(--alarm) }
/* Pflichtziel geschafft */
.zeile.erreicht .val{ color:var(--glut-hi) }

/* Fusszeile: Uhrzeit + Wetter */
.fusszeile{
  padding:.7rem 1.2rem .75rem; border-top:.16rem solid var(--rand);
  background:rgba(255,122,24,.08);
  display:flex; align-items:center; justify-content:center; gap:.7rem;
  font-size:1.35rem; font-weight:700; font-variant-numeric:tabular-nums;
}
.fusszeile .tr{ color:var(--glut); opacity:.65 }
.fusszeile svg{ width:1.7rem; height:1.7rem; display:block }
.fusszeile svg path,.fusszeile svg circle,.fusszeile svg line{
  stroke:var(--glut-hi); stroke-width:2.4; fill:none;
  stroke-linecap:round; stroke-linejoin:round;
}
#blk-wetter{ display:none; align-items:center; gap:.4rem }

/* Kommen keine frischen Werte, werden die Zahlen blass.
   Die Renn-Uhr bleibt hell -- die laeuft weiter. */
body.stale .zeile:not(#z-uhr) .val,
body.stale .zeile:not(#z-uhr) .unit{ opacity:.40; transition:opacity .6s ease }

/* ---- Signet unten rechts ---- */
.signet{ position:absolute; right:2.4rem; bottom:2.4rem; text-align:right }
.signet img{ display:block; height:7rem; width:auto; margin-left:auto;
             filter:drop-shadow(0 .3rem 1rem rgba(0,0,0,.8)) }
.wortmarke{
  font-family:'Oswald',sans-serif; font-weight:700; font-style:italic;
  text-transform:uppercase; font-size:3.4rem; line-height:.95; color:#1a1310;
  -webkit-text-stroke:.11rem var(--glut);
  text-shadow:0 0 1.1rem rgba(255,122,24,.85), 0 0 2.6rem rgba(255,122,24,.45),
              0 .2rem .6rem rgba(0,0,0,.9);
}
.wortmarke .vs{ color:var(--glut-hi); -webkit-text-stroke:.11rem var(--glut-hi) }
.mail{
  margin-top:.5rem; font-family:'Oswald',sans-serif; font-weight:600;
  letter-spacing:.13em; font-size:1.3rem; color:var(--glut-hi);
  text-shadow:0 .15rem .6rem rgba(0,0,0,.95);
}
.signet.aus{ display:none }

/* ---- Intro: Standbild mit Countdown ---- */
.intro{
  position:fixed; inset:0; z-index:50; background:#0a0605 center/cover no-repeat;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .9s ease;
}
.intro.hide{ opacity:0; pointer-events:none }
.intro.gone{ display:none }
.intro::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(8,5,4,.55) 0%, rgba(8,5,4,.86) 100%);
}
.intro > *{ position:relative; z-index:1 }
.intro .kicker{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:2rem; letter-spacing:.5em; color:var(--glut); margin-bottom:1.4rem;
}
.intro .titel{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:6.4rem; line-height:.95; text-align:center;
}
.intro .cd-lab{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:1.7rem; letter-spacing:.32em; color:var(--glut); margin-top:3.4rem;
}
.intro .cd{
  font-size:7.4rem; font-weight:700; font-variant-numeric:tabular-nums;
  line-height:1; margin-top:.7rem;
}
.hinweis{
  position:fixed; left:50%; bottom:3rem; transform:translateX(-50%); z-index:51;
  font-family:'Oswald',sans-serif; letter-spacing:.2em; font-size:1.3rem;
  color:var(--glut-hi); opacity:0; transition:opacity .5s;
}
.hinweis.show{ opacity:.9 }

/* ---- Diagnose ---- */
#dbg{
  position:absolute; right:2.4rem; top:2.4rem; z-index:9; max-width:34rem;
  font-family:'Oswald',monospace; font-size:1.25rem; line-height:1.35;
  padding:.6rem 1rem; white-space:pre-wrap;
  background:rgba(0,0,0,.82); border:.12rem solid var(--glut); color:var(--glut-hi);
}
#dbg.hidden{ display:none }
#dbg.err{ border-color:var(--alarm); color:#ffb3ae }
</style>
</head>
<body>

<div class="feld">

  <div class="live" id="k-live"><i></i><span>Live</span></div>

  <div class="spalte">
    <div class="titel" id="k-titel">Rennen</div>

    <div class="zeile gross" id="z-uhr">
      <div class="lab" id="lab-uhr">Restzeit</div>
      <div class="row"><span class="val" id="t-uhr">--:--:--</span></div>
    </div>

    <div class="zeile">
      <div class="lab">Gelaufen</div>
      <div class="row"><span class="val" id="t-km">0,00</span><span class="unit">km</span></div>
    </div>

    <div class="zeile" id="z-rest">
      <div class="lab" id="lab-rest">Rest-Distanz</div>
      <div class="row"><span class="val" id="t-rest">--</span><span class="unit">km</span></div>
    </div>

    <div class="zeile">
      <div class="lab">Pace</div>
      <div class="row"><span class="val" id="t-pace">--:--</span><span class="unit">/km</span></div>
    </div>

    <div class="zeile">
      <div class="lab">&#216; Pace</div>
      <div class="row"><span class="val" id="t-apace">--:--</span><span class="unit">/km</span></div>
    </div>

    <div class="zeile" id="z-hf">
      <div class="lab">HF</div>
      <div class="row"><span class="val" id="t-hr">--</span><span class="unit">bpm</span></div>
    </div>

    <div class="zeile">
      <div class="lab">H&ouml;henmeter</div>
      <div class="row"><span class="val" id="t-hm">0</span><span class="unit">hm</span></div>
    </div>

    <div class="fusszeile uhr">
      <span id="t-clock">--:--</span>
      <span class="tr" id="tr-wx" style="display:none">|</span>
      <span id="blk-wetter"><span id="wx-icon"></span><span id="t-temp">--,-&nbsp;°C</span></span>
    </div>
  </div>

  <div class="signet" id="k-signet">
    <img id="k-logo" src="logo.png" alt="">
    <div class="wortmarke" id="k-wort">You <span class="vs">vs</span> You</div>
    <div class="mail" id="k-mail">kontakt@you-vs-you.online</div>
  </div>

</div>

<div class="intro gone" id="intro">
  <div class="kicker" id="i-kicker">Live</div>
  <div class="titel" id="i-titel">You vs You</div>
  <div class="cd-lab">Start in</div>
  <div class="cd" id="i-cd">--:--:--</div>
</div>
<audio id="i-audio" preload="none"></audio>
<div class="hinweis" id="i-hinweis">Zum Starten tippen</div>

<div id="dbg" class="hidden">--</div>

<script>
/* ================================================================
   YOU VS YOU -- Live-Overlay

   Woher die Werte kommen:
     Standard ("show")  von der Bruecke bei Cloudflare, die sie
                        bei Garmin LiveTrack abholt.
     ?mode=send         Notbetrieb: GPS des Geraets, auf dem das
                        Overlay laeuft, und Versand an die Bruecke.

   Ueber die Adresse steuerbar:
     &live=…      Adresse der Bruecke
     &key=…       Kennwort, nur im Notbetrieb noetig
     &target=52.5 Pflichtziel in Kilometern
     &duration=6  Renndauer in Stunden
     &racestart=2026-09-12T10:00:00%2B02:00
     &start=…     Zeitpunkt, ab dem das Standbild verschwindet
     &title=…     Ueberschrift der Spalte
     &hoch=1      alles in den hochformat-sicheren Bereich
     &livebadge=0 LIVE-Kennzeichen ausblenden
     &mail=…      andere Adresse, leer = ausblenden
     &signet=0    Signet unten rechts weg
     &wx=51.5547,7.9139   Ort fuers Wetter
     &debug=1     Diagnose-Schild
     &demo=1      erfundene Werte zum Ausprobieren
     &training=1  Aufnahmebetrieb: alles beginnt bei null, Zeit zaehlt
                  hoch, kein Streckenziel, kein LIVE-Kennzeichen.
                  Die Uhr steht still, bis die Fenix eine laufende
                  Aktivitaet meldet -- dann startet sie mit deren Wert
     &sofort=1    nur im Aufnahmebetrieb: Uhr laeuft schon beim Laden,
                  ohne auf die Fenix zu warten
     &wer=2       zweiter Platz in der Bruecke (Partner)
   ================================================================ */

const CONFIG = {
  targetKm:    52.5,
  durationH:   6,
  raceStartAt: "2026-09-12T10:00:00+02:00",
  startAt:     null,
  title:       "6H Ultra Werl",
  liveUrl:     "https://vvy-live.527nv2tghb.workers.dev",
  liveKey:     "",
  mode:        "show",
  wxAt:        "51.5547,7.9139",
  introImage:  "",
  introAudio:  "",
  introKicker: "Live",
  demo:        false,
  debug:       false,
  training:    false
};

(function(){
  const q = new URLSearchParams(location.search);
  const map = { racestart:'raceStartAt', start:'startAt', title:'title',
                live:'liveUrl', key:'liveKey', mode:'mode', wx:'wxAt',
                image:'introImage', audio:'introAudio', kicker:'introKicker' };
  for (const [k,v] of Object.entries(map)) if (q.has(k)) CONFIG[v] = q.get(k);
  if (q.has('target'))   CONFIG.targetKm  = parseFloat(String(q.get('target')).replace(',','.')) || 0;
  if (q.has('duration')) CONFIG.durationH = parseFloat(String(q.get('duration')).replace(',','.')) || 0;
  if (q.has('demo'))     CONFIG.demo  = q.get('demo')  !== '0';
  if (q.has('debug'))    CONFIG.debug = q.get('debug') !== '0';
  CONFIG.mode = CONFIG.mode === 'send' ? 'send' : 'show';

  /* ---- Aufnahmebetrieb ----
     Fuer eigene Aufnahmen ohne Livestream. Alles beginnt bei null:
     die Zeit zaehlt hoch statt rueckwaerts, es gibt kein Streckenziel
     und kein Renndatum -- der Start ist der Augenblick des Ladens.
     Wer einen Wert anders haben will, haengt ihn einfach zusaetzlich
     an; ausdruecklich Gesetztes gewinnt gegen die Voreinstellung. */
  if (q.has('training') && q.get('training') !== '0'){
    CONFIG.training    = true;
    CONFIG.durationH   = q.has('duration')  ? CONFIG.durationH   : 0;
    CONFIG.targetKm    = q.has('target')    ? CONFIG.targetKm    : 0;
    CONFIG.raceStartAt = q.has('racestart') ? CONFIG.raceStartAt : '';
    CONFIG.title       = q.has('title')     ? CONFIG.title       : 'Training';
  }
})();

const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);

/* Welcher Platz in der Bruecke? 1 = Sascha, 2 = Partner.
   Ohne Angabe immer 1 -- damit bleibt alles Bestehende gleich.
   Aufruf: overlay.html?wer=2 */
const WER    = q.get('wer') === '2' ? 2 : 1;
const ANHANG = WER === 2 ? '?wer=2' : '';

/* Bau-Kennung im Fenstertitel. In Moblin unsichtbar -- dort wird nur
   der Seiteninhalt gezeigt -- im Browser-Tab aber sofort ablesbar.
   Damit laesst sich ohne Zweifel pruefen, welche Fassung geladen ist
   und welchen Platz sie abfragt. */
/* ---- Wann faengt die Uhr an zu laufen? ----
   Im Rennbetrieb sofort -- dort ist der Start ein fester Zeitpunkt.
   Im Aufnahmebetrieb NICHT: dort soll das Overlay schon im Bild
   stehen, waehrend alles auf null steht, und erst anspringen, wenn
   auf der Fenix eine Aktivitaet laeuft. Genau dann meldet die Bruecke
   eine Laufzeit, und syncStart() unten setzt den Startpunkt.
   Mit &sofort=1 laesst sich das Warten ueberspringen. */
let laeuftLos = !CONFIG.training || q.get('sofort') === '1' || CONFIG.demo;

const BAU = '2026-08-24-wartet';
document.title = 'Race Overlay - ' + (CONFIG.training ? 'Aufnahme' : 'Rennen') +
                 ' - Platz ' + WER + ' - Bau ' + BAU;

const SENDET  = CONFIG.mode === 'send' && !CONFIG.demo;
const HOLT    = CONFIG.mode === 'show' && !CONFIG.demo;
const STALE_MS = 45000;

const revealMs    = CONFIG.startAt ? new Date(CONFIG.startAt).getTime() : 0;
let   raceStartMs = CONFIG.raceStartAt ? new Date(CONFIG.raceStartAt).getTime()
                                       : (revealMs || Date.now());
const geplantMs   = raceStartMs;            /* Rueckfallwert aus dem Zeitplan */
const SYNC        = q.get('sync') !== '0';  /* Start von der Uhr uebernehmen  */
let   startFest   = false;                  /* Anker steht, nicht mehr ruecken */

/* Der einmal gefundene Startpunkt wird im Browser hinterlegt. Startet
   die Quelle mitten im Rennen neu -- Absturz, Szenenwechsel, Netz weg --
   nimmt sie exakt denselben Anker wieder auf und springt nicht. */
const SKEY = 'vvy-start:' + String(CONFIG.raceStartAt || 'frei');
function ankerLesen(){
  try{
    const v = Number(localStorage.getItem(SKEY));
    if (!isFinite(v) || v <= 0) return null;
    const alter = Date.now() - v;
    const fenster = ((CONFIG.durationH > 0 ? CONFIG.durationH : 6) * 3600000) + 7200000;
    return (alter > -3600000 && alter < fenster) ? v : null;
  }catch(_){ return null; }
}
function ankerSchreiben(ms){ try{ localStorage.setItem(SKEY, String(ms)); }catch(_){} }

if (q.get('reset') === '1' || CONFIG.training){
  /* Im Aufnahmebetrieb wird der gemerkte Startpunkt bewusst verworfen.
     Sonst haenge die naechste Aufnahme an der Zeit der vorherigen. */
  try{ localStorage.removeItem(SKEY); }catch(_){}
}
else {
  const gemerkt = ankerLesen();
  if (gemerkt !== null){ raceStartMs = gemerkt; startFest = true; }
}

const state = { meter:0, gain:0, hr:null, fix:0, tempC:null, wxCode:null,
                last:null, baseAlt:null, spur:[] };
const feed  = { pace:null, apace:null, pAge:null, ok:false };

/* ---- Anzeige einrichten ---- */
if (q.get('hoch') === '1')      document.body.classList.add('hoch');
/* Eine Aufnahme ist nicht live -- das Kennzeichen waere schlicht
   unwahr. Mit &livebadge=1 laesst es sich trotzdem einschalten. */
if (q.get('livebadge') === '0' || (CONFIG.training && q.get('livebadge') !== '1'))
  $('k-live').classList.add('aus');
if (q.get('signet') === '0')    $('k-signet').classList.add('aus');
if (CONFIG.debug)               $('dbg').classList.remove('hidden');
$('k-titel').textContent = CONFIG.title;
$('i-titel').textContent = CONFIG.title;
$('i-kicker').textContent = CONFIG.introKicker;
if (!CONFIG.targetKm) $('z-rest').classList.add('hidden');
if (CONFIG.durationH <= 0) $('lab-uhr').textContent = 'Laufzeit';

$('k-logo').style.display = 'none';
$('k-logo').onload  = function(){ this.style.display='block'; $('k-wort').style.display='none'; };
$('k-logo').onerror = function(){ this.remove(); };

(function(){
  const m = q.get('mail');
  const txt = m !== null ? m : 'kontakt@you-vs-you.online';
  if (!txt.trim()) $('k-mail').style.display = 'none'; else $('k-mail').textContent = txt;
})();

function melde(art, txt){
  console.log('[Overlay] ' + art + ' — ' + txt);
  if (!CONFIG.debug) return;
  $('dbg').className = art === 'err' ? 'err' : '';
  $('dbg').textContent = txt;
}

/* ================================================================
   Werkzeug
   ================================================================ */
const pad = n => String(n).padStart(2,'0');
const hms = s => pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s/60)%60) + ':' + pad(Math.floor(s)%60);
const komma = (n,k) => n.toFixed(k).replace('.', ',');
function paceTxt(s){
  if (!isFinite(s) || s <= 0 || s > 3600) return '--:--';
  return pad(Math.floor(s/60)) + ':' + pad(Math.round(s)%60);
}
function distM(a,b){
  const R = 6371000, r = Math.PI/180;
  const p1 = a.lat*r, p2 = b.lat*r;
  const dp = p2-p1, dl = (b.lon-a.lon)*r;
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ================================================================
   Wetter
   ================================================================ */
const ICONS = {
  sun:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="8"/><line x1="20" y1="3" x2="20" y2="7"/><line x1="20" y1="33" x2="20" y2="37"/><line x1="3" y1="20" x2="7" y2="20"/><line x1="33" y1="20" x2="37" y2="20"/><line x1="8" y1="8" x2="11" y2="11"/><line x1="29" y1="29" x2="32" y2="32"/><line x1="32" y1="8" x2="29" y2="11"/><line x1="11" y1="29" x2="8" y2="32"/></svg>',
  cloud:'<svg viewBox="0 0 40 40"><path d="M11 29h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 29z"/></svg>',
  rain:'<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><line x1="14" y1="29" x2="12" y2="35"/><line x1="21" y1="29" x2="19" y2="35"/><line x1="28" y1="29" x2="26" y2="35"/></svg>',
  snow:'<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><line x1="13" y1="31" x2="17" y2="31"/><line x1="15" y1="29" x2="15" y2="33"/><line x1="23" y1="31" x2="27" y2="31"/><line x1="25" y1="29" x2="25" y2="33"/></svg>',
  storm:'<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><path d="M21 27l-5 6h5l-3 5"/></svg>'
};
function setIcon(code){
  let k;
  if (code <= 1) k='sun';
  else if (code <= 48) k='cloud';
  else if ((code>=71&&code<=77)||code===85||code===86) k='snow';
  else if (code >= 95) k='storm';
  else k='rain';
  $('wx-icon').innerHTML = ICONS[k];
}
setIcon(3);

function wxOrt(){
  if (state.last) return [state.last.lat, state.last.lon];
  const p = String(CONFIG.wxAt||'').split(',');
  const la = parseFloat(p[0]), lo = parseFloat(p[1]);
  return isFinite(la) && isFinite(lo) ? [la,lo] : null;
}
let wxAt = 0;
async function updateWeather(){
  const ort = wxOrt();
  if (!ort || Date.now() - wxAt < 600000) return;
  wxAt = Date.now();
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' +
      ort[0].toFixed(3) + '&longitude=' + ort[1].toFixed(3) +
      '&current=temperature_2m,weather_code');
    const j = await r.json();
    state.tempC  = j.current.temperature_2m;
    state.wxCode = j.current.weather_code;
    $('t-temp').textContent = komma(state.tempC, 1) + ' °C';
    setIcon(state.wxCode);
    $('blk-wetter').style.display = 'inline-flex';
    $('tr-wx').style.display = '';
  }catch(_){ wxAt = Date.now() - 540000; }
}

/* ================================================================
   Werte holen -- Standardbetrieb
   ================================================================ */
const Feed = (function(){
  const aus = { tick(){} };
  if (!HOLT) return aus;
  if (!CONFIG.liveUrl){ melde('err','AUS — live= fehlt im Link'); return aus; }

  const url = String(CONFIG.liveUrl).replace(/\/+$/,'') + '/' + ANHANG;
  /* Der Zeitstempel gegen den Zwischenspeicher haengt hinten an.
     Steht schon ein ?wer=2 in der Adresse, muss das Trennzeichen ein
     & sein -- ein zweites ? wuerde den Wert zu "2?t=..." machen und
     die Bruecke faende Platz 2 nicht mehr. */
  const TRENNER = url.indexOf('?') >= 0 ? '&' : '?';
  let holAt = 0, busy = false, n = 0;

  /* Die Uhr am Handgelenk gibt den Start vor.
     Sobald die Bruecke eine laufende Stoppuhr meldet, wird der
     Countdown genau dorthin gelegt -- egal, was im Zeitplan steht.
     Das geschieht genau einmal. Stoppe ich die Aktivitaet spaeter
     versehentlich und starte sie neu, faellt die Rennzeit dadurch
     nicht auf null zurueck. */
  function syncStart(d){
    if (!SYNC || startFest || d.elapsed == null) return;
    const e = Number(d.elapsed);
    if (!isFinite(e) || e <= 0) return;
    raceStartMs = Date.now() - e;
    startFest = true;
    laeuftLos = true;                 /* jetzt darf die Uhr loslaufen */
    ankerSchreiben(raceStartMs);
    melde('ok','Start von der Uhr uebernommen');
  }

  async function hol(){
    if (busy) return;
    busy = true;
    try{
      const r = await fetch(url + TRENNER + 't=' + Date.now(), { cache:'no-store' });
      const j = await r.json();
      const d = j && j.data;
      if (d){
        syncStart(d);
        const m = (Number(d.km)||0) * 1000;
        if (m > state.meter) state.meter = m;
        if (Number(d.gain) > state.gain) state.gain = Number(d.gain);
        if (d.hr != null) state.hr = Number(d.hr);
        feed.pace  = d.pace  != null ? Number(d.pace)  : null;
        feed.apace = d.apace != null ? Number(d.apace) : null;
        feed.pAge  = j.pAge != null ? Number(j.pAge) : null;
        feed.ok = true; state.fix = Date.now(); n++;
        melde('ok', 'OK ' + komma(state.meter/1000,2) + ' km\n' +
                    (feed.pAge!=null ? Math.round(feed.pAge/1000)+' s alt' : 'ohne Zeitstempel') +
                    ' · ' + n + '. Abruf' + (j.err ? '\nBruecke: '+j.err : ''));
      } else {
        feed.ok = false;
        melde('err', 'noch keine Werte' + (j && j.err ? '\n' + j.err : ''));
      }
    }catch(e){
      feed.ok = false;
      melde('err', 'kein Netz\n' + (e && e.message ? e.message : e));
    }
    busy = false;
  }
  hol();
  return { tick(){ const t = Date.now(); if (t - holAt < 5000) return; holAt = t; hol(); } };
})();

/* ================================================================
   Notbetrieb -- eigenes GPS, Versand an die Bruecke
   ================================================================ */
if (SENDET && 'geolocation' in navigator){
  navigator.geolocation.watchPosition(p => {
    if (Date.now() < raceStartMs) return;
    const c = p.coords;
    if (c.accuracy > 30) return;
    const now = p.timestamp || Date.now();
    const pt = { lat:c.latitude, lon:c.longitude, t:now };
    if (state.last){
      const d = distM(state.last, pt), dt = (now - state.last.t)/1000;
      if (d >= 4 && dt > 0 && d/dt < 12){
        state.meter += d;
        state.spur.push({ t:now, m:state.meter });
        state.last = pt;
      }
    } else state.last = pt;
    if (typeof c.altitude === 'number' && !isNaN(c.altitude)){
      if (state.baseAlt === null) state.baseAlt = c.altitude;
      const d = c.altitude - state.baseAlt;
      if (d > 4){ state.gain += d; state.baseAlt = c.altitude; }
      else if (d < -4) state.baseAlt = c.altitude;
    }
    state.fix = Date.now();
  }, () => {}, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

const Live = (function(){
  const aus = { tick(){} };
  if (!SENDET) return aus;
  if (!CONFIG.liveUrl || !CONFIG.liveKey){
    melde('err','Notbetrieb ohne Versand — live= oder key= fehlt'); return aus;
  }
  /* Auch der Notweg schreibt auf den gewaehlten Platz. */
  const url = String(CONFIG.liveUrl).replace(/\/+$/,'') + '/' + ANHANG;
  const hist = []; let letzte = 0, histMin = -1, busy = false;
  return { tick(){
    const now = Date.now();
    if (now < raceStartMs || now - letzte < 30000 || busy) return;
    letzte = now; busy = true;
    const el = Math.max(0, now - raceStartMs);
    const min = Math.floor(el/60000);
    if (Math.floor(min/5) > histMin){
      histMin = Math.floor(min/5);
      hist.push([min, Math.round(state.meter)/1000]);
      if (hist.length > 200) hist.shift();
    }
    fetch(url, { method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Token': CONFIG.liveKey },
      body: JSON.stringify({ v:2, src:'handy', t:now, pt:now,
        title:CONFIG.title, km:Math.round(state.meter)/1000, gain:Math.round(state.gain),
        hr:state.hr, elapsed:el,
        left: CONFIG.durationH>0 ? Math.max(0, CONFIG.durationH*3600000-el) : null,
        dur:CONFIG.durationH||null, target:CONFIG.targetKm||null,
        pace:null, apace:null, temp:state.tempC, wx:state.wxCode, hist:hist })
    }).then(r => melde(r.ok?'ok':'err', r.ok ? 'gesendet' : 'Sendefehler ' + r.status))
      .catch(() => melde('err','Senden fehlgeschlagen'))
      .finally(() => { busy = false; });
  }};
})();

/* ---- Demo ---- */
if (CONFIG.demo){
  /* Zum Ausprobieren soll sofort etwas laufen. Liegt der Rennstart noch
     in der Zukunft -- am 23.08. sind das drei Wochen -- blieben sonst
     alle Werte auf null und der Countdown stuende still. Fuer die
     Vorfuehrung wird der Start deshalb auf "vor zehn Minuten" gelegt.
     Betrifft ausschliesslich den Demo-Betrieb, nichts wird gespeichert. */
  if (Date.now() < raceStartMs){
    raceStartMs = Date.now() - 600000;
    startFest   = true;
  }
  laeuftLos = true;
  setInterval(() => {
    if (Date.now() < raceStartMs) return;
    state.meter += 2.6 + Math.random();
    state.gain  += Math.random()*.5;
    state.hr = 150 + Math.round(Math.random()*12);
    state.spur.push({ t:Date.now(), m:state.meter });
    state.fix = Date.now();
  }, 1000);
}

/* ================================================================
   Anzeige
   ================================================================ */
function zeichne(){
  const now = Date.now();
  /* Solange die Uhr wartet, bleibt die Laufzeit bei null -- und mit ihr
     alles, was aus ihr berechnet wird (Restzeit, Durchschnittstempo). */
  const el  = laeuftLos ? Math.max(0, now - raceStartMs) : 0;

  if (CONFIG.durationH > 0){
    const rest = Math.max(0, CONFIG.durationH*3600000 - el);
    $('t-uhr').textContent = hms(rest/1000);
    $('z-uhr').classList.toggle('final', el > 0 && rest <= 600000);
  } else {
    $('t-uhr').textContent = hms(el/1000);
  }

  const t = new Date();
  $('t-clock').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());

  const km = state.meter/1000;
  $('t-km').textContent = komma(km, 2);
  $('t-hm').textContent = String(Math.round(state.gain));
  $('t-hr').textContent = state.hr ? state.hr : '--';

  if (CONFIG.targetKm){
    if (km >= CONFIG.targetKm){
      $('lab-rest').textContent = 'Über Ziel';
      $('t-rest').textContent = '+' + komma(km - CONFIG.targetKm, 2);
      $('z-rest').classList.add('erreicht');
    } else {
      $('lab-rest').textContent = 'Rest-Distanz';
      $('t-rest').textContent = komma(CONFIG.targetKm - km, 2);
      $('z-rest').classList.remove('erreicht');
    }
  }

  /* Tempo: bevorzugt von der Bruecke, damit Website und Stream
     dieselben Zahlen zeigen. Sonst aus der eigenen Spur. */
  let pace = 0, apace = 0;
  if (HOLT){
    pace  = feed.pace  != null ? feed.pace  : 0;
    apace = feed.apace != null ? feed.apace : 0;
  } else {
    while (state.spur.length && now - state.spur[0].t > 90000) state.spur.shift();
    if (state.spur.length > 1){
      const a = state.spur[0], b = state.spur[state.spur.length-1];
      const dKm = (b.m-a.m)/1000, dS = (b.t-a.t)/1000;
      if (dKm > .02) pace = dS/dKm;
    }
    apace = km > .05 ? (el/1000)/km : 0;
  }
  $('t-pace').textContent  = paceTxt(pace);
  $('t-apace').textContent = paceTxt(apace);

  if (HOLT){
    const alt = feed.pAge === null ? Infinity : feed.pAge;
    document.body.classList.toggle('stale', !feed.ok || alt > STALE_MS);
  }

  updateWeather();
  Feed.tick();
  Live.tick();
  requestAnimationFrame(zeichne);
}
zeichne();

/* ================================================================
   Intro: Standbild + Countdown bis zum Rennstart
   ================================================================ */
(function(){
  const intro = $('intro'), musik = $('i-audio'), hint = $('i-hinweis');
  if (!revealMs || Date.now() >= revealMs) return;

  intro.classList.remove('gone');
  if (CONFIG.introImage) intro.style.backgroundImage = 'url("' + CONFIG.introImage + '")';

  let frei = false;
  function starte(){
    if (frei) return;
    frei = true; hint.classList.remove('show');
    if (CONFIG.introAudio){
      musik.src = CONFIG.introAudio; musik.volume = .55;
      musik.play().catch(() => {});
    }
  }
  if (CONFIG.introAudio){
    setTimeout(() => { if (!frei) hint.classList.add('show'); }, 1200);
    document.addEventListener('pointerdown', starte, { once:true, capture:true });
  }

  (function tick(){
    const rest = revealMs - Date.now();
    if (rest <= 0){
      intro.classList.add('hide');
      setTimeout(() => intro.classList.add('gone'), 1000);
      if (!musik.paused){
        const w = setInterval(() => {
          musik.volume = Math.max(0, musik.volume - .04);
          if (musik.volume <= .01){ musik.pause(); clearInterval(w); }
        }, 120);
      }
      return;
    }
    $('i-cd').textContent = hms(rest/1000);
    setTimeout(tick, 250);
  })();
})();
</script>
