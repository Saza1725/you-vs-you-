<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Race Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FARBSCHEMA — eine Zeile tauschen, alles zieht nach
   Aktuell: Graphit + Acid-Lime
   Alternativen:  Amber #FFB020 · Eisblau #5CE1E6 · Magenta #FF4D8D
                  Broadcast-Gold #FFD400
   ============================================================ */

:root{
  --accent:  #D7FF3E;
  --white:   #FFFFFF;
  --alert:   #FF4D4D;
  --dim:     rgba(255,255,255,.50);
  --panel:   linear-gradient(180deg, rgba(18,23,31,.94) 0%, rgba(9,12,17,.96) 100%);
  --line:    rgba(255,255,255,.16);
}

*{margin:0;padding:0;box-sizing:border-box}
html{
  font-size: min(calc(100vw / 192), calc(100vh / 108));
}

body{
  background: transparent;                 /* PFLICHT für Overlay-Nutzung */
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  color:var(--white); overflow:hidden; width:100vw; height:100vh;
  -webkit-font-smoothing: antialiased;
}
.stage{position:fixed; inset:0}

/* ---------- Typo-Bausteine ---------- */

.label{
  font-family:'Barlow Condensed','Arial Narrow',sans-serif;
  font-weight:700; text-transform:uppercase;
  letter-spacing:.14em; color:var(--accent); line-height:1;
}
.value{
  font-weight:700; font-variant-numeric:tabular-nums;
  letter-spacing:-.015em; line-height:1; white-space:nowrap;
}
.unit{
  font-family:'Barlow Condensed',sans-serif; font-weight:600;
  color:var(--dim); letter-spacing:.12em; text-transform:uppercase;
}
.stale{ opacity:.4 }
body:not(.imperial) .imp{ display:none }

/* ---------- 1 · Restzeit oben links ---------- */

.hero{
  position:absolute; top:2rem; left:2rem;
  padding:1.1rem 2.6rem 1.5rem 2.2rem;
  background:var(--panel);
  border-left:.6rem solid var(--accent);
}
.hero .label{ font-size:1.6rem; margin-bottom:.7rem }
.hero .value{ font-size:7.2rem }
.hero.final{ border-left-color:var(--alert) }
.hero.final .value{ color:var(--alert) }

/* ---------- 2 · Uhrzeit + Wetter oben rechts ---------- */

.env{
  position:absolute; top:2rem; right:2rem;
  display:flex; align-items:stretch;
  background:var(--panel);
  border-right:.6rem solid var(--accent);
}
.env .cell{ padding:1.1rem 2rem 1.3rem; border-left:.1rem solid var(--line) }
.env .cell:first-child{ border-left:0 }
.env .label{ font-size:1.35rem; margin-bottom:.7rem }
.env .value{ font-size:2.9rem }
.env .wx{ display:flex; align-items:center; gap:1.4rem }
.env .icon{ width:4.4rem; height:4.4rem; flex:none }
.env .icon svg{ width:100%; height:100% ; display:block }
.env .icon path, .env .icon circle, .env .icon line{
  stroke:var(--accent); stroke-width:1.9; fill:none;
  stroke-linecap:round; stroke-linejoin:round;
}

/* ---------- 3 · Datenleiste unten ---------- */

.bar{
  position:absolute; left:0; right:0; bottom:0;
  background:var(--panel);
  border-top:.2rem solid rgba(255,255,255,.14);
}

.progress{ position:relative; height:.7rem; background:rgba(255,255,255,.10) }
.progress .fill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:var(--accent); transition:width .6s linear;
}

.grid{
  display:grid;
  grid-template-columns: 27rem repeat(6, 1fr);
  align-items:stretch;
}

.ident{
  padding:2rem 2.4rem 2.2rem;
  background:rgba(215,255,62,.07);
  border-right:.2rem solid var(--accent);
}
.ident .top{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:3.4rem; line-height:1; letter-spacing:.02em; color:var(--accent);
}
.ident .bot{
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  font-size:1.4rem; letter-spacing:.34em; color:var(--white); margin-top:.9rem;
}

.cellx{
  padding:2rem 2rem 2.2rem;
  border-left:.1rem solid var(--line);
  display:flex; flex-direction:column; justify-content:space-between;
}
.cellx:first-of-type{ border-left:0 }
.cellx .label{ font-size:1.55rem; margin-bottom:1.1rem }
.cellx .main{ display:flex; align-items:baseline; gap:.8rem }
.cellx .value{ font-size:3.6rem }
.cellx .main .unit{ font-size:1.6rem }
.cellx .second{ display:flex; align-items:baseline; gap:.6rem; margin-top:.6rem }
.cellx .second .value{ font-size:1.7rem; color:var(--dim); font-weight:600 }
.cellx .second .unit{ font-size:1.25rem }

/* ---------- Hochformat / schmale Fenster: Leiste umbrechen ---------- */

@media (max-aspect-ratio: 4/5){
  html{ font-size: calc(100vw / 62); }
  .hero{ top:1.4rem; left:1.4rem; padding:.9rem 1.8rem 1.2rem 1.6rem }
  .hero .value{ font-size:6rem }
  .env{ top:1.4rem; right:1.4rem }
  .env .value{ font-size:2.4rem }
  .env .icon{ width:3.4rem; height:3.4rem }
  .grid{ grid-template-columns: repeat(3, 1fr) }
  .ident{
    grid-column:1 / -1; border-right:0;
    border-bottom:.2rem solid var(--accent);
    display:flex; align-items:baseline; gap:1.6rem; padding:1.2rem 1.6rem;
  }
  .ident .bot{ margin-top:0 }
  .cellx{ padding:1.4rem 1.4rem 1.6rem }
  .cellx:nth-child(3n+2){ border-left:0 }
  .cellx .label{ font-size:1.5rem; margin-bottom:.8rem }
  .cellx .value{ font-size:3.1rem }
}

/* ---------- 4 · Intro: Standbild mit Countdown ---------- */

.intro{
  position:fixed; inset:0; z-index:50;
  background:#05070A center/cover no-repeat;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .9s ease;
}
.intro.hide{ opacity:0; pointer-events:none }
.intro.gone{ display:none }
.intro::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(5,7,10,.55) 0%, rgba(5,7,10,.80) 100%);
}
.intro > *{ position:relative; z-index:1 }

.intro .kicker{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:2.2rem; letter-spacing:.5em; color:var(--accent); margin-bottom:1.6rem;
}
.intro .title{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:7rem; line-height:.95; letter-spacing:.02em; text-align:center;
}
.intro .cd-label{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:1.8rem; letter-spacing:.34em; color:var(--accent);
  margin:4.4rem 0 1.2rem;
}
.intro .cd{
  font-weight:700; font-variant-numeric:tabular-nums;
  font-size:11rem; line-height:1; letter-spacing:-.02em;
}
.intro .rule{ height:.4rem; width:26rem; background:var(--accent); margin-top:3rem }

.sound-hint{
  position:absolute; left:50%; bottom:8%; transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  font-size:1.5rem; letter-spacing:.12em; color:var(--white);
  background:rgba(0,0,0,.55); border:.1rem solid var(--accent);
  padding:.8rem 2rem; border-radius:3rem; opacity:0; pointer-events:none;
  transition:opacity .4s ease; z-index:70; white-space:nowrap;
}
.sound-hint.show{ opacity:1 }

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="stage">

  <!-- 1 · Restzeit -->
  <div class="hero" id="hero">
    <div class="label" id="hero-label">Restzeit</div>
    <div class="value" id="hero-timer">00:00:00</div>
  </div>

  <!-- 2 · Uhrzeit + Wetter -->
  <div class="env">
    <div class="cell">
      <div class="label">Uhrzeit</div>
      <div class="value" id="clock">--:--</div>
    </div>
    <div class="cell" id="blk-weather">
      <div class="label">Wetter</div>
      <div class="wx">
        <div class="value" id="temp-c">--.-&deg;</div>
        <div class="icon" id="wx-icon"></div>
      </div>
    </div>
  </div>

  <!-- 3 · Datenleiste -->
  <section class="bar">
    <div class="progress"><div class="fill" id="progress-fill"></div></div>

    <div class="grid">

      <div class="ident">
        <div class="top" id="badge-title">Ultra</div>
        <div class="bot" id="badge-sub">Live</div>
      </div>

      <div class="cellx">
        <div class="label">Gelaufen</div>
        <div>
          <div class="main"><span class="value" id="dist-km">0.0</span><span class="unit">km</span></div>
          <div class="second imp"><span class="value" id="dist-mi">0.0</span><span class="unit">mi</span></div>
        </div>
      </div>

      <div class="cellx" id="blk-remaining">
        <div class="label">Rest-Distanz</div>
        <div>
          <div class="main"><span class="value" id="rem-km">0.0</span><span class="unit">km</span></div>
          <div class="second imp"><span class="value" id="rem-mi">0.0</span><span class="unit">mi</span></div>
        </div>
      </div>

      <div class="cellx">
        <div class="label">Akt. Pace</div>
        <div>
          <div class="main"><span class="value" id="pace-km">--:--</span><span class="unit">/ km</span></div>
          <div class="second imp"><span class="value" id="pace-mi">--:--</span><span class="unit">/ mi</span></div>
        </div>
      </div>

      <div class="cellx">
        <div class="label">&Oslash; Pace</div>
        <div>
          <div class="main"><span class="value" id="apace-km">--:--</span><span class="unit">/ km</span></div>
          <div class="second imp"><span class="value" id="apace-mi">--:--</span><span class="unit">/ mi</span></div>
        </div>
      </div>

      <div class="cellx">
        <div class="label">H&ouml;henmeter</div>
        <div>
          <div class="main"><span class="value" id="ele-m">0</span><span class="unit">m</span></div>
          <div class="second imp"><span class="value" id="ele-ft">0</span><span class="unit">ft</span></div>
        </div>
      </div>

      <div class="cellx">
        <div class="label">Laufzeit</div>
        <div>
          <div class="main"><span class="value" id="perf-timer">00:00</span></div>
        </div>
      </div>

    </div>
  </section>

  <!-- 4 · Intro -->
  <div class="intro" id="intro">
    <div class="kicker" id="intro-kicker">Live</div>
    <div class="title" id="intro-title">Ultra</div>
    <div class="cd-label">Start in</div>
    <div class="cd" id="intro-cd">--:--:--</div>
    <div class="rule"></div>
  </div>

  <audio id="intro-audio" loop preload="auto"></audio>
  <div class="sound-hint" id="sound-hint">Zum Aktivieren des Tons antippen</div>

</div>

<script>
/* ================================================================
   KONFIGURATION — auch per URL-Parameter setzbar.
   Zwei getrennte Zeitpunkte:

   start      = wann das Foto/der Countdown verschwindet und die
                Kamera sichtbar wird (z. B. Vorlauf, Aufwaermen)
   racestart  = wann die 6-Stunden-Uhr und alle Streckendaten
                (km, Pace, Hoehenmeter) tatsaechlich zu zaehlen
                beginnen (der offizielle Startschuss)

   Beispiel:
   overlay.html?target=52.5&duration=6&title=6H%20ULTRA
     &start=2026-09-12T10:00:00%2B02:00
     &racestart=2026-09-12T10:15:00%2B02:00
     &image=start.jpg&audio=musik.mp3
   ================================================================ */
const CONFIG = {
  targetKm:    0,        // Zieldistanz in km. 0 = Rest-Distanz und Fortschritt aus
  durationH:   0,        // Dauer in Stunden. >0 = grosse Uhr laeuft rueckwaerts
  startAt:     null,     // wann Foto/Countdown endet und die Kamera erscheint
  raceStartAt: null,     // wann die 6h-Uhr und Streckendaten zu zaehlen beginnen
  title:       "Ultra",  // Text links in der Leiste / Intro-Titel
  subtitle:    "Live",
  weather:     true,     // Wetter ueber Open-Meteo (kein API-Key noetig)
  imperial:    false,    // true = zusaetzlich Meilen und Fuss
  demo:        false,    // true = simulierte Werte zum Testen

  /* --- Intro vor dem Lauf --- */
  introImage:  "",       // Dateiname des Standbilds, z. B. "start.jpg"
  introAudio:  "",       // Dateiname der Musik waehrend des Countdowns, z. B. "musik.mp3"
  introKicker: "Live"    // kleine Zeile ueber dem Titel
};

(function(){
  const q = new URLSearchParams(location.search);
  const map = { target:'targetKm', start:'startAt', racestart:'raceStartAt',
                title:'title', sub:'subtitle',
                image:'introImage', audio:'introAudio', kicker:'introKicker' };
  for (const [k,v] of Object.entries(map)) if (q.has(k)) CONFIG[v] = q.get(k);
  if (q.has('target'))   CONFIG.targetKm  = parseFloat(String(q.get('target')).replace(',','.')) || 0;
  if (q.has('duration')) CONFIG.durationH = parseFloat(String(q.get('duration')).replace(',','.')) || 0;
  if (q.has('demo'))     CONFIG.demo     = q.get('demo') !== '0';
  if (q.has('weather'))  CONFIG.weather  = q.get('weather') !== '0';
  if (q.has('imperial')) CONFIG.imperial = q.get('imperial') !== '0';
})();

const $ = id => document.getElementById(id);

const revealMs = CONFIG.startAt ? new Date(CONFIG.startAt).getTime() : 0;
// Ohne eigenen racestart-Parameter faellt der Rennstart mit der Kamera-Enthuellung zusammen
const raceStartMs = CONFIG.raceStartAt ? new Date(CONFIG.raceStartAt).getTime() : (revealMs || Date.now());

const state = {
  meters: 0, gain: 0, last: null, baseAlt: null, trail: [], fix: 0
};

$('badge-title').textContent = CONFIG.title;
$('badge-sub').textContent   = CONFIG.subtitle;
if (!CONFIG.targetKm){
  $('blk-remaining').style.visibility = 'hidden';
  document.querySelector('.progress').style.display = 'none';
}
if (!CONFIG.weather) $('blk-weather').style.display = 'none';
if (CONFIG.imperial) document.body.classList.add('imperial');

/* ---- Wettersymbole ---- */
const ICONS = {
  sun:   '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="8"/><line x1="20" y1="3" x2="20" y2="8"/><line x1="20" y1="32" x2="20" y2="37"/><line x1="3" y1="20" x2="8" y2="20"/><line x1="32" y1="20" x2="37" y2="20"/><line x1="8" y1="8" x2="11.5" y2="11.5"/><line x1="28.5" y1="28.5" x2="32" y2="32"/><line x1="32" y1="8" x2="28.5" y2="11.5"/><line x1="11.5" y1="28.5" x2="8" y2="32"/></svg>',
  cloud: '<svg viewBox="0 0 40 40"><path d="M11 29h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 29z"/></svg>',
  rain:  '<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><line x1="14" y1="29" x2="12" y2="35"/><line x1="21" y1="29" x2="19" y2="35"/><line x1="28" y1="29" x2="26" y2="35"/></svg>',
  snow:  '<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><line x1="13" y1="31" x2="17" y2="31"/><line x1="15" y1="29" x2="15" y2="33"/><line x1="23" y1="31" x2="27" y2="31"/><line x1="25" y1="29" x2="25" y2="33"/></svg>',
  storm: '<svg viewBox="0 0 40 40"><path d="M11 24h18a6 6 0 0 0 .4-12 9 9 0 0 0-17.3 2.2A5.5 5.5 0 0 0 11 24z"/><path d="M21 27l-5 6h5l-3 5"/></svg>'
};
function setIcon(code){
  let k;
  if (code <= 1) k = 'sun';
  else if (code <= 48) k = 'cloud';
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) k = 'snow';
  else if (code >= 95) k = 'storm';
  else k = 'rain';
  $('wx-icon').innerHTML = ICONS[k];
}
setIcon(3);

/* ---- Formatierung ---- */
const pad = n => String(n).padStart(2,'0');
function hms(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(s%60);
}
function hm(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60));
}
function pace(secPerUnit){
  if (!isFinite(secPerUnit) || secPerUnit <= 0 || secPerUnit > 5999) return '--:--';
  return pad(Math.floor(secPerUnit/60)) + ':' + pad(Math.round(secPerUnit%60));
}

/* ---- Haversine ---- */
function distM(a, b){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (b.lat-a.lat)*rad, dLon = (b.lon-a.lon)*rad;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(s)));
}

/* ---- Standort ---- */
function onFix(p){
  if (Date.now() < raceStartMs) return;              // vor dem Rennstart zaehlt nichts
  const c = p.coords;
  if (c.accuracy > 30) return;                        // unsaubere Fixes verwerfen
  const now = p.timestamp || Date.now();
  const pt = { lat:c.latitude, lon:c.longitude, t:now, alt:c.altitude };

  if (state.last){
    const d = distM(state.last, pt);
    const dt = (now - state.last.t)/1000;
    if (d >= 4 && dt > 0 && d/dt < 12){               // Jitter- und Ausreisserfilter
      state.meters += d;
      state.trail.push({ t: now, m: state.meters });
      state.last = pt;
    }
  } else {
    state.last = pt;
  }

  if (typeof pt.alt === 'number' && !isNaN(pt.alt)){
    if (state.baseAlt === null) state.baseAlt = pt.alt;
    const d = pt.alt - state.baseAlt;
    if (d > 4){ state.gain += d; state.baseAlt = pt.alt; }
    else if (d < -4){ state.baseAlt = pt.alt; }
  }
  state.fix = Date.now();
}

if (!CONFIG.demo && 'geolocation' in navigator){
  navigator.geolocation.watchPosition(onFix, () => {},
    { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

/* ---- Wetter ---- */
let weatherAt = 0;
async function updateWeather(){
  if (!CONFIG.weather || !state.last) return;
  if (Date.now() - weatherAt < 600000) return;
  weatherAt = Date.now();
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' +
      state.last.lat.toFixed(3) + '&longitude=' + state.last.lon.toFixed(3) +
      '&current=temperature_2m,weather_code');
    const j = await r.json();
    $('temp-c').textContent = j.current.temperature_2m.toFixed(1) + '\u00B0';
    setIcon(j.current.weather_code);
  }catch(_){ weatherAt = Date.now() - 540000; }       // in 60 s erneut versuchen
}

/* ---- Demo ---- */
if (CONFIG.demo){
  $('temp-c').textContent = '15.8\u00B0';
  setIcon(0);
  setInterval(() => {
    if (Date.now() < raceStartMs) return;             // vor dem Rennstart zaehlt nichts
    state.meters += 2.5 + Math.random();
    state.gain   += Math.random() * .6;
    state.fix     = Date.now();
    state.trail.push({ t: Date.now(), m: state.meters });
  }, 1000);
}

/* ---- Render ---- */
function render(){
  const now = Date.now();
  const elapsed = Math.max(0, now - raceStartMs);     // vor Rennstart konstant 0

  if (CONFIG.durationH > 0){
    const left = Math.max(0, CONFIG.durationH*3600000 - elapsed);
    $('hero-timer').textContent = hms(left);
    $('hero').classList.toggle('final', elapsed > 0 && left <= 600000);
  } else {
    $('hero-timer').textContent = hms(elapsed);
  }
  $('perf-timer').textContent = hm(elapsed);

  const t = new Date();
  $('clock').textContent = pad(t.getHours()) + ':' + pad(t.getMinutes());

  const km = state.meters/1000;
  $('dist-km').textContent = km.toFixed(1);
  $('dist-mi').textContent = (km/1.609344).toFixed(1);

  if (CONFIG.targetKm){
    const rk = Math.max(0, CONFIG.targetKm - km);
    $('rem-km').textContent = rk.toFixed(1);
    $('rem-mi').textContent = (rk/1.609344).toFixed(1);
    $('progress-fill').style.width = Math.min(100, km/CONFIG.targetKm*100).toFixed(1) + '%';
  }

  const aSec = km > .05 ? (elapsed/1000)/km : 0;
  $('apace-km').textContent = pace(aSec);
  $('apace-mi').textContent = pace(aSec*1.609344);

  while (state.trail.length && now - state.trail[0].t > 90000) state.trail.shift();
  let cSec = 0;
  if (state.trail.length > 1){
    const a = state.trail[0], b = state.trail[state.trail.length-1];
    const dKm = (b.m - a.m)/1000, dS = (b.t - a.t)/1000;
    if (dKm > .02) cSec = dS/dKm;
  }
  $('pace-km').textContent = pace(cSec);
  $('pace-mi').textContent = pace(cSec*1.609344);

  $('ele-m').textContent  = Math.round(state.gain).toLocaleString('de-DE');
  $('ele-ft').textContent = Math.round(state.gain*3.28084).toLocaleString('de-DE');

  const stale = now >= raceStartMs && (!state.fix || now - state.fix > 25000);
  document.querySelectorAll('.cellx').forEach((el, i) => {
    if (i < 5) el.classList.toggle('stale', stale);
  });

  updateWeather();
  requestAnimationFrame(render);
}
render();

/* ================================================================
   INTRO: Standbild + Musik -> Countdown -> Kamerabild
   Nur aktiv, wenn ?start= in der Zukunft liegt.
   ================================================================ */
(function(){
  const intro = $('intro'), music = $('intro-audio'), hint = $('sound-hint');

  $('intro-title').textContent  = CONFIG.title;
  $('intro-kicker').textContent = CONFIG.introKicker;
  if (CONFIG.introImage) intro.style.backgroundImage = 'url("' + CONFIG.introImage + '")';

  if (!revealMs || Date.now() >= revealMs){ intro.classList.add('gone'); return; }

  /* Ton: iOS erlaubt Audio nur nach einer echten Beruehrung der Seite.
     Ein einziges Antippen (irgendwo) schaltet die Musik fuer den Rest
     der Sitzung frei. Ohne Antippen bleibt es stumm -- nichts bricht ab. */
  let unlocked = false;
  function unlock(){
    if (unlocked) return;
    unlocked = true;
    hint.classList.remove('show');
    if (CONFIG.introAudio){
      music.src = CONFIG.introAudio;
      music.volume = .55;
      music.play().catch(() => {});
    }
  }
  document.addEventListener('pointerdown', unlock, { once:true, capture:true });

  if (CONFIG.introAudio){
    setTimeout(() => { if (!unlocked) hint.classList.add('show'); }, 1200);
  }

  function reveal(){
    music.pause();
    hint.classList.remove('show');
    intro.classList.add('hide');
    setTimeout(() => intro.classList.add('gone'), 1000);
  }

  const tick = setInterval(() => {
    const left = revealMs - Date.now();
    if (left <= 0){
      clearInterval(tick);
      $('intro-cd').textContent = '00:00:00';
      reveal();
      return;
    }
    $('intro-cd').textContent = hms(left);
  }, 250);
})();

/* ---- Display wach halten ---- */
if ('wakeLock' in navigator){
  const hold = () => navigator.wakeLock.request('screen').catch(()=>{});
  hold();
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && hold());
}
</script>
</body>
</html>
