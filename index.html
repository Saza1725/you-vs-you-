<style>
/* ================================================================
   YOU VS YOU — Wartungsseite
   Eigenstaendige Datei. Die richtige Seite liegt unveraendert
   daneben als seite.html und ist ueber
   www.you-vs-you.online/seite.html erreichbar.

   Zurueckschalten:
     1. diese index.html loeschen
     2. seite.html wieder in index.html umbenennen

@font-face{
  font-family:"Oswald"; font-style:normal; font-weight:200 700;
  font-display:swap; src:url("fonts/oswald-latin.woff2") format("woff2");
}
@font-face{
  font-family:"Rajdhani"; font-style:normal; font-weight:600;
  font-display:swap; src:url("fonts/rajdhani-600-latin.woff2") format("woff2");
}

:root{
  --ink:      #08050F;
  --accent:   #FF7A18;
  --accent-hi:#FFB25E;
  --white:    #FFFFFF;
  --dim:      rgba(255,255,255,.72);
  --faint:    rgba(255,255,255,.42);
}

*{box-sizing:border-box; margin:0; padding:0}

html,body{height:100%}

body{
  background:var(--ink);
  color:var(--white);
  font-family:"Rajdhani","Oswald",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex; align-items:center; justify-content:center;
  padding:calc(2rem + env(safe-area-inset-top,0px)) 1.5rem
          calc(2rem + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}

/* ---- Hintergrund: eigenes Startbild, unscharf und abgedunkelt ----
   Zwei Bilder je nach Geraetehaltung, damit auf dem Handy nicht
   die Querformat-Fassung geladen wird.                            */
.bg{
  position:fixed; inset:-6vmax;            /* groesser als der Schirm,
                                              sonst zeigt der Weichzeichner
                                              helle Raender */
  background-image:image-set(url("start.webp") type("image/webp"),
                             url("start.jpg")  type("image/jpeg"));
  background-size:cover; background-position:center;
  filter:blur(26px) saturate(.9);
  transform:scale(1.06);
  z-index:0;
}
@media (max-aspect-ratio:1/1) and (max-width:33.99rem){
  .bg{
    background-image:image-set(url("start-hoch.webp") type("image/webp"),
                               url("start-hoch.jpg")  type("image/jpeg"));
  }
}
.veil{
  position:fixed; inset:0; z-index:1;
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(8,5,15,.58) 0%, rgba(8,5,15,.86) 62%, rgba(8,5,15,.95) 100%);
}

main{
  position:relative; z-index:2;
  width:100%; max-width:40rem;
  text-align:center;
}

.marke{
  font-family:"Oswald",sans-serif;
  font-weight:600;
  font-size:clamp(.78rem,2.6vw,1rem);
  letter-spacing:.42em;
  text-indent:.42em;                        /* gleicht die Sperrung rechts aus */
  color:var(--accent);
  margin-bottom:clamp(.9rem,3vw,1.4rem);
}

h1{
  font-family:"Oswald",sans-serif;
  font-weight:700;
  font-size:clamp(2.1rem,10vw,4.4rem);
  line-height:1.02;
  letter-spacing:.005em;
  text-transform:uppercase;
}

.strich{
  width:clamp(3.4rem,14vw,6rem); height:4px;
  background:var(--accent); border-radius:2px;
  margin:clamp(1.1rem,4vw,1.8rem) auto clamp(1rem,3.6vw,1.6rem);
}

p.text{
  font-size:clamp(1rem,3.6vw,1.22rem);
  line-height:1.6; color:var(--dim);
}

/* ---- drei Punkte, wie auf den Stream-Karten ---- */
.punkte{
  display:flex; gap:.6rem; justify-content:center;
  margin:clamp(1.3rem,4.5vw,2rem) 0;
}
.punkte i{
  width:9px; height:9px; border-radius:50%;
  background:var(--accent);
  animation:puls 1.5s ease-in-out infinite;
}
.punkte i:nth-child(2){animation-delay:.25s}
.punkte i:nth-child(3){animation-delay:.5s}
@keyframes puls{
  0%,100%{opacity:.28; transform:scale(.82)}
  50%    {opacity:1;   transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .punkte i{animation:none; opacity:.7}
}

.hinweis{
  font-size:clamp(.86rem,3vw,.98rem);
  color:var(--faint);
  margin-bottom:clamp(.8rem,3vw,1.1rem);
}

.knoepfe{
  display:flex; flex-direction:column; align-items:center;
  gap:.7rem;
}
.knopf{
  display:inline-flex; align-items:center; gap:.55rem;
  min-width:13.5rem; justify-content:center;
  padding:.82rem 1.6rem;
  border-radius:999px;
  font-family:"Oswald",sans-serif;
  font-weight:600; font-size:clamp(.95rem,3.4vw,1.05rem);
  letter-spacing:.02em;
  text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.knopf svg{width:1.12em; height:1.12em; flex:none}
.knopf.voll{
  background:var(--accent); color:#120804;
  box-shadow:0 8px 26px rgba(255,122,24,.30);
}
.knopf.rand{
  border:2px solid rgba(255,122,24,.75);
  color:var(--accent-hi);
}
.knopf:hover,.knopf:focus-visible{transform:translateY(-2px)}
.knopf.voll:hover,.knopf.voll:focus-visible{box-shadow:0 12px 32px rgba(255,122,24,.42)}
.knopf.rand:hover,.knopf.rand:focus-visible{background:rgba(255,122,24,.12)}
.knopf:focus-visible{outline:3px solid var(--accent-hi); outline-offset:3px}

footer{
  margin-top:clamp(1.6rem,6vw,2.6rem);
  font-size:clamp(.76rem,2.6vw,.86rem);
  color:rgba(255,255,255,.34);
  letter-spacing:.08em;
}
footer a{color:inherit; text-decoration:none}
footer a:hover{color:var(--accent-hi)}
</style>
</head>

<body>
<div class="bg" role="presentation"></div>
<div class="veil" role="presentation"></div>

<main>
  <div class="marke">YOU VS YOU</div>

  <h1>Wir bauen um</h1>

  <div class="strich" role="presentation"></div>

  <p class="text">
    Die Seite wird gerade überarbeitet.<br>
    Gleich geht es weiter.
  </p>

  <div class="punkte" role="presentation"><i></i><i></i><i></i></div>

  <p class="hinweis">Solange hier weiter:</p>

  <div class="knoepfe">
    <a class="knopf voll" href="https://www.instagram.com/prinz_saza"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
      @prinz_saza
    </a>

    <a class="knopf rand" href="https://www.instagram.com/last_meters"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
      @last_meters
    </a>
  </div>

  <footer>
    <a href="seite.html#impressum">Impressum</a> &nbsp;·&nbsp;
    <a href="seite.html#datenschutz">Datenschutz</a>
  </footer>
</main>
</body>
</html>
