<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOU VS YOU — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Gleiche Designsprache wie das Stream-Overlay: Graphit + Acid-Lime
   Farbe hier aendern -> zieht auf der ganzen Seite mit
   ============================================================ */
:root{
  --ink:     #0A0D12;
  --panel:   #141922;
  --accent:  #D7FF3E;
  --white:   #FFFFFF;
  --dim:     rgba(255,255,255,.55);
  --line:    rgba(255,255,255,.14);
}

*{margin:0;padding:0;box-sizing:border-box}
html{ scroll-behavior:smooth }

body{
  background:var(--ink); color:var(--white);
  font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
  min-height:100vh;
  display:flex; flex-direction:column;
}

/* ---------- Kopf ---------- */

header{
  padding:2.2rem 1.5rem 1.6rem;
  text-align:center;
  border-bottom:.15rem solid var(--line);
}
.kicker{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.5em; color:var(--accent); font-size:.85rem; margin-bottom:.7rem;
}
h1{
  font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.02em; font-size:clamp(2rem, 6vw, 3.6rem); line-height:1;
}
.status{
  display:inline-flex; align-items:center; gap:.5rem;
  margin-top:1rem; padding:.4rem 1.1rem;
  border:.1rem solid var(--accent); border-radius:2rem;
  font-family:'Barlow Condensed',sans-serif; font-weight:600; text-transform:uppercase;
  letter-spacing:.14em; font-size:.85rem; color:var(--accent);
}
.status i{
  width:.55rem; height:.55rem; border-radius:50%; background:var(--accent);
  box-shadow:0 0 .6rem rgba(215,255,62,.8);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

/* ---------- Player ---------- */

main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:1.6rem 1rem 2.4rem }

.player-wrap{
  width:100%; max-width:112rem;
  aspect-ratio:16/9;
  background:var(--panel);
  border:.1rem solid var(--line);
}
.player-wrap iframe{ width:100%; height:100%; border:0; display:block }

.fallback{
  max-width:112rem; width:100%;
  margin-top:1.2rem;
  font-family:'Barlow Condensed',sans-serif; font-size:1rem;
  color:var(--dim); text-align:center;
}
.fallback a{ color:var(--accent); text-decoration:none; font-weight:700 }
.fallback a:hover{ text-decoration:underline }

/* ---------- Fuss ---------- */

footer{
  text-align:center; padding:1.6rem;
  font-family:'Barlow Condensed',sans-serif; font-size:.85rem;
  color:var(--dim); letter-spacing:.08em;
  border-top:.15rem solid var(--line);
}
footer a{ color:var(--dim) }

@media (max-width: 640px){
  .player-wrap{ aspect-ratio:9/16 }   /* Handy-Video oft hochkant */
}
</style>
</head>
<body>

<header>
  <div class="kicker">Live Stream</div>
  <h1>You vs You</h1>
  <div class="status"><i></i>Live</div>
</header>

<main>
  <div class="player-wrap">
    <iframe
      src="https://player.twitch.tv/?channel=DEINKANALNAME&parent=you-vs-you.online&parent=www.you-vs-you.online&muted=false"
      allowfullscreen>
    </iframe>
  </div>

  <div class="fallback">
    Kein Bild? Direkt auf <a href="https://twitch.tv/DEINKANALNAME" target="_blank" rel="noopener">twitch.tv/DEINKANALNAME</a> vorbeischauen.
  </div>
</main>

<footer>
  you-vs-you.online
</footer>

</body>
</html>
