<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seite nicht gefunden — YOU VS YOU</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0D0620">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{
  font-family:'Oswald'; font-style:normal; font-weight:200 700; font-display:swap;
  src:url(fonts/oswald-latin.woff2) format('woff2-variations');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:'Rajdhani'; font-style:normal; font-weight:600; font-display:swap;
  src:url(fonts/rajdhani-600-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(1rem,2.5vw,1.8rem); text-align:center; padding:2rem;
  background:#0D0620 center/cover no-repeat;
  background-image:url("start.jpg");
  background-image:image-set(url("start.webp") type("image/webp"), url("start.jpg") type("image/jpeg"));
  color:#fff; font-family:'Rajdhani','Arial Narrow',Arial,sans-serif; position:relative;
}
body::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(13,6,32,.72) 0%, rgba(13,6,32,.62) 42%, rgba(13,6,32,.95) 100%);
}
body > *{ position:relative; z-index:1 }
.kicker{
  font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
  font-size:clamp(.6rem,1.3vw,.95rem); letter-spacing:.5em; color:#FFD400;
}
h1{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(3rem,14vw,8rem); line-height:.9; letter-spacing:.02em;
}
p{
  font-size:clamp(.95rem,1.6vw,1.15rem); line-height:1.6;
  color:rgba(255,255,255,.7); max-width:32rem;
}
a.btn{
  margin-top:.6rem; display:inline-flex; align-items:center; gap:.8em;
  padding:clamp(.85rem,1.6vw,1.1rem) clamp(1.8rem,4vw,3rem);
  background:#FFD400; color:#170B2C; text-decoration:none;
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  font-size:clamp(.9rem,1.8vw,1.3rem); letter-spacing:.18em;
  clip-path: polygon(1.1rem 0, 100% 0, 100% calc(100% - 1.1rem), calc(100% - 1.1rem) 100%, 0 100%, 0 1.1rem);
  transition:transform .2s ease, box-shadow .25s ease;
}
a.btn:hover{ transform:translateY(-3px); box-shadow:0 .8rem 2.4rem rgba(255,212,0,.32) }
a.btn svg{ width:1.1em; height:1.1em; flex:none }
a.btn svg path{ stroke:#170B2C; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
  <div class="kicker">Fehler 404</div>
  <h1>Falsch<br>abgebogen</h1>
  <p>Diese Seite gibt es nicht. Zurück auf die Strecke — der Countdown läuft weiter.</p>
  <a class="btn" href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11.5 6l-6 6 6 6"/></svg>
    Zur Startseite
  </a>
</body>
</html>
